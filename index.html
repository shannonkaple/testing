<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ms. Kaple's Double-Click STEM Arcade</title>
<style>
@font-face{font-family:Homebody;src:url('./KAHomebodyClub.ttf') format('truetype');font-display:swap}
@font-face{font-family:VAG;src:url('./VAGRoundedBold.ttf') format('truetype');font-display:swap}
:root{
  --ink:#191919; --pink:#ff4f9a; --orange:#ff861c; --yellow:#ffd429;
  --green:#7bd642; --blue:#31afe4; --purple:#9337d9; --cream:#fffdfa;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f5f7;color:var(--ink);font-family:VAG,Arial,sans-serif;user-select:none}
button{font:inherit}
#shell{
  min-height:100vh;border:12px solid transparent;
  border-image:linear-gradient(90deg,#ff3b7f 0 14%,#ff7b1e 14% 28%,#ffd323 28% 42%,#4bcf5c 42% 57%,#20b8e8 57% 71%,#7546e7 71% 86%,#ff3b7f 86%) 1;
  background:white;
}
header{
  border-bottom:5px solid #1f1f1f;background:#fff;padding:10px 18px 12px;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
}
.brand{display:flex;align-items:flex-end;gap:10px;min-width:0}
.brand .ms{font-family:Homebody,VAG,sans-serif;font-size:clamp(32px,4vw,62px);white-space:nowrap}
.brand .arcade{font-family:VAG,Arial,sans-serif;font-size:clamp(27px,4.2vw,60px);line-height:.9;letter-spacing:-1px;white-space:nowrap}
.rainbowText{
  background:linear-gradient(90deg,#f52c8b,#ff7a18,#f6cc15,#56c84d,#17aee5,#7240da,#e43ac4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nav button{
  min-height:44px;padding:8px 15px;border:4px solid #1f1f1f;border-radius:15px;background:white;
  box-shadow:0 3px 0 #1f1f1f;cursor:pointer
}
.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #1f1f1f}
main{padding:14px}
.view{display:none}.view.active{display:block}
.home-note{text-align:center;font-size:clamp(17px,2vw,25px);margin:4px 0 14px}
.game-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1450px;margin:auto
}
.game-card{
  border:5px solid #202020;border-radius:22px;background:white;overflow:hidden;cursor:pointer;padding:0;
  box-shadow:0 5px 0 #202020;text-align:left;min-width:0
}
.game-card:active{transform:translateY(3px);box-shadow:0 2px 0 #202020}
.game-card .bar{padding:9px 12px;text-align:center;font-size:clamp(20px,2.1vw,34px);line-height:1}
.game-card .thumb{
  height:190px;background:#fff;display:grid;place-items:center;overflow:hidden;border-top:4px solid #202020;border-bottom:4px solid #202020
}
.game-card .thumb img{width:100%;height:100%;object-fit:contain}
.game-card .desc{text-align:center;padding:8px 10px;font-size:17px;background:#fff}
.c1 .bar{background:#ff6ca9}.c2 .bar{background:#ffd83c}.c3 .bar{background:#77dc5a}
.c4 .bar{background:#44c4ef}.c5 .bar{background:#b26ae8}.c6 .bar{background:#ff9d3b}

#gameTop{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  max-width:1450px;margin:0 auto 10px
}
#gameTitle{font-size:clamp(25px,3vw,42px)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:white;border:4px solid #222;border-radius:999px;padding:7px 12px;font-size:17px}
#direction{
  max-width:1450px;margin:0 auto 10px;border:4px solid #222;border-radius:18px;padding:8px 12px;background:#fff;
  min-height:78px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:clamp(20px,2.2vw,32px)
}
#direction img{width:66px;height:58px;object-fit:contain}
#stage{
  max-width:1450px;margin:auto;border:5px solid #222;border-radius:24px;background:#f8fbff;min-height:620px;
  position:relative;overflow:hidden
}
#toast{
  position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:100;background:white;border:4px solid #222;
  border-radius:16px;padding:8px 15px;font-size:23px;opacity:0;pointer-events:none;transition:.15s
}
#toast.show{opacity:1}
.you-win{
  position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.92);z-index:90;text-align:center
}
.you-win .box{border:6px solid #222;border-radius:26px;padding:28px 42px;background:#fff;box-shadow:0 7px 0 #222}
.you-win h2{font-size:clamp(50px,8vw,110px);margin:0;color:#7a35d6}
.you-win p{font-size:25px;margin:6px 0 15px}.you-win button{padding:12px 22px;border:4px solid #222;border-radius:16px;background:#ffd83c}

.target{
  position:absolute;width:145px;height:125px;border:0;background:transparent;cursor:pointer;touch-action:manipulation;
  transition:left 1.45s ease-in-out,top 1.45s ease-in-out
}
.target img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 2px rgba(0,0,0,.16))}
.catch-bg{
  position:absolute;inset:0;background:
   linear-gradient(#dff6ff 0 65%,#e9d4aa 65% 100%);
}
.catch-title{
  position:absolute;left:50%;top:34px;transform:translateX(-50%);font-size:clamp(30px,5vw,68px);opacity:.08
}

.reveal-wrap{position:absolute;inset:18px;display:grid;place-items:center;background:#111;border-radius:18px;overflow:hidden}
.reveal-wrap img{width:100%;height:100%;object-fit:contain;background:#111}
.reveal-tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:3px}
.reveal-tile{border:0;cursor:pointer;background:linear-gradient(145deg,#8a43e5,#ff5cab);outline:2px solid rgba(255,255,255,.75)}
.reveal-tile:nth-child(3n+2){background:linear-gradient(145deg,#28bcea,#6ee45e)}
.reveal-tile:nth-child(3n){background:linear-gradient(145deg,#ffce26,#ff7a1f)}
.reveal-tile.gone{opacity:0;pointer-events:none;transition:.2s}

.desktop{position:absolute;inset:18px;background:linear-gradient(#7edbff 0 64%,#77d65c 64%);border-radius:18px;border:4px solid #222;overflow:hidden}
.desktop-taskbar{position:absolute;left:0;right:0;bottom:0;height:50px;background:#263544}
.folder-grid{position:absolute;inset:35px 30px 80px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;align-items:center}
.folder-btn{border:0;background:transparent;cursor:pointer;display:grid;gap:4px;justify-items:center}
.folder-btn img{width:min(15vw,170px);height:135px;object-fit:contain}
.folder-label{background:white;border:3px solid #222;border-radius:10px;padding:5px 8px;font-size:18px}
.fake-window{
  position:absolute;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,82%);background:white;border:5px solid #222;border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.25);overflow:hidden
}
.window-bar{height:46px;background:#35aee4;border-bottom:4px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:22px}
.window-bar button{width:38px;height:34px;border:3px solid #222;border-radius:8px;background:#ff6b7d;cursor:pointer}
.window-content{padding:18px;text-align:center;font-size:22px}
.window-content img{width:190px;height:160px;object-fit:contain}

.scene-img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain;background:white;border-radius:16px}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer}
.hotspot.correct-flash{outline:6px solid #5bcf4b;border-radius:16px;background:rgba(91,207,75,.12)}
.hotspot.wrong-flash{outline:6px solid #ff5c78;border-radius:16px;background:rgba(255,92,120,.12)}

.build-layout{position:absolute;inset:18px;display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.build-choice-panel,.build-tray{border:4px solid #222;border-radius:18px;background:#fff;padding:12px}
.build-choice-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:center}
.choice-btn{
  min-height:150px;border:4px solid #222;border-radius:16px;background:#f8fbff;cursor:pointer;padding:8px;display:grid;place-items:center
}
.choice-btn img{width:120px;height:105px;object-fit:contain}
.build-tray{display:flex;flex-direction:column}
.build-tray h3{text-align:center;font-size:26px;margin:0 0 8px}
.build-slot{flex:1;min-height:85px;border:3px dashed #aaa;border-radius:14px;margin:6px;padding:6px;display:flex;align-items:center;gap:10px}
.build-slot img{width:85px;height:75px;object-fit:contain}
.build-slot.done{border-style:solid;border-color:#55bf47;background:#efffea}

.collect-board{position:absolute;inset:18px;border-radius:18px;background:linear-gradient(#e6f7ff,#fff7df);border:4px solid #222;overflow:hidden}
.collect-item{
  position:absolute;width:115px;height:100px;border:0;background:transparent;cursor:pointer;padding:0;
  animation:bob 2.8s ease-in-out infinite alternate;
}
.collect-item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 2px rgba(0,0,0,.15))}
.collect-item.gone{opacity:0;pointer-events:none;transition:.25s}
@keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}

@media(max-width:900px){
  header{grid-template-columns:1fr}.nav{justify-content:center}.brand{justify-content:center}
  .game-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #stage{min-height:700px}
  .folder-grid{grid-template-columns:repeat(2,1fr)}
  .build-layout{grid-template-columns:1fr}.build-choice-panel{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:560px){
  .game-grid{grid-template-columns:1fr}.brand .arcade{white-space:normal}
}
</style>
</head>
<body>
<div id="shell">
<header>
  <div class="brand">
    <div class="ms">Ms. Kaple's</div>
    <div class="arcade rainbowText">DOUBLE-CLICK STEM ARCADE</div>
  </div>
  <div class="nav">
    <button id="homeBtn">GAMES</button>
    <button id="restartBtn">↻ RESTART</button>
    <button id="prevBtn">◀ PREV</button>
    <button id="nextBtn">NEXT ▶</button>
  </div>
</header>
<main>
  <section id="home" class="view active">
    <div class="home-note">Six different STEM double-click games. Choose one!</div>
    <div id="cards" class="game-grid"></div>
  </section>

  <section id="game" class="view">
    <div id="gameTop">
      <div id="gameTitle"></div>
      <div class="stats">
        <div class="pill">Score: <span id="score">0</span></div>
        <div class="pill" id="roundPill">Round: <span id="round">1</span></div>
        <div class="pill">Best: <span id="best">0</span></div>
      </div>
    </div>
    <div id="direction"></div>
    <div id="stage"><div id="toast"></div></div>
  </section>
</main>
</div>
<script>
const HOTSPOTS = {"hidden_room1.jpg": {"whiteboard": [30.0, 10.0, 38.12, 24.44], "clock": [83.12, 7.22, 10.0, 17.78], "bookcase": [76.25, 36.67, 18.75, 36.67], "desk": [24.38, 63.33, 30.0, 27.78], "chair": [52.5, 66.67, 14.37, 26.67], "computer": [32.5, 47.78, 18.75, 23.33]}, "hidden_room2.jpg": {"whiteboard": [44.38, 7.78, 36.25, 23.33], "clock": [7.5, 6.11, 10.0, 17.78], "bookcase": [5.0, 35.56, 18.75, 37.78], "desk": [51.25, 62.22, 29.38, 27.78], "chair": [35.0, 66.67, 15.0, 27.22], "computer": [58.75, 47.22, 18.75, 23.33]}};

const games=[
 {title:"Catch the Computer!",desc:"Catch the moving STEM target",color:"c1",type:"catch",thumb:"computer.png"},
 {title:"Reveal the Picture!",desc:"Uncover a bright hidden STEM picture",color:"c2",type:"reveal",thumb:"reveal1.jpg"},
 {title:"Open the Files!",desc:"Open the correct STEM folder",color:"c3",type:"files",thumb:"folder_green.png"},
 {title:"Hidden Picture Hunt!",desc:"Find the STEM item inside a cartoon room",color:"c4",type:"hunt",thumb:"hidden_room1.jpg"},
 {title:"Build It!",desc:"Match the parts to build STEM stations",color:"c5",type:"build",thumb:"computer.png"},
 {title:"Collect Them All!",desc:"Collect every matching STEM item",color:"c6",type:"collect",thumb:"pencil.png"}
];

const assets={
 computer:{word:"COMPUTER",img:"computer.png"},
 clock:{word:"CLOCK",img:"clock.png"},
 desk:{word:"DESK",img:"desk.png"},
 chair:{word:"CHAIR",img:"chair.png"},
 bookcase:{word:"BOOKCASE",img:"bookcase.png"},
 whiteboard:{word:"WHITEBOARD",img:"whiteboard.png"},
 pencil:{word:"PENCIL",img:"pencil.png"},
 scissors:{word:"SCISSORS",img:"scissors.png"},
 notebook:{word:"NOTEBOOK",img:"notebook.png"},
 marker:{word:"MARKER",img:"marker.png"},
 glue:{word:"GLUE",img:"glue.png"},
 paperclip:{word:"PAPER CLIP",img:"paperclip.png"}
};

const cards=document.getElementById("cards"), home=document.getElementById("home"), game=document.getElementById("game");
const stage=document.getElementById("stage"), direction=document.getElementById("direction"), gameTitle=document.getElementById("gameTitle");
const scoreEl=document.getElementById("score"), roundEl=document.getElementById("round"), bestEl=document.getElementById("best"), roundPill=document.getElementById("roundPill");
const toast=document.getElementById("toast");
let current=0, score=0, round=1, timer=null, state={};

function bestKey(){return "msKapleSTEM_"+games[current].type+"_best"}
function getBest(){return Number(localStorage.getItem(bestKey())||0)}
function setScore(v){score=v;scoreEl.textContent=score;if(score>getBest())localStorage.setItem(bestKey(),score);bestEl.textContent=getBest()}
function setRound(v){round=v;roundEl.textContent=round}
function clearTimer(){if(timer){clearTimeout(timer);timer=null}}
function resetStage(){clearTimer();stage.innerHTML='<div id="toast"></div>';state={}}
function directionPic(key,text){
 const a=assets[key];
 direction.innerHTML=`<img src="${a.img}" alt="${a.word}"><span>${text.replace("{{WORD}}",a.word)}</span>`;
}
function directionText(text){direction.innerHTML=`<span>${text}</span>`}
function showToast(msg){
 const t=document.getElementById("toast"); if(!t)return;
 t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),650)
}
function win(){
 const best=getBest();
 const div=document.createElement("div");div.className="you-win";
 div.innerHTML=`<div class="box"><h2>YOU WIN!</h2><p>Score: ${score} &nbsp; • &nbsp; Best: ${best}</p><button type="button">PLAY AGAIN</button></div>`;
 div.querySelector("button").onclick=()=>startGame(current);
 stage.appendChild(div);
}
games.forEach((g,i)=>{
 const b=document.createElement("button");b.className=`game-card ${g.color}`;
 b.innerHTML=`<div class="bar">${g.title}</div><div class="thumb"><img src="${g.thumb}" alt=""></div><div class="desc">${g.desc}</div>`;
 b.onclick=()=>startGame(i);cards.appendChild(b)
});
function showHome(){clearTimer();game.classList.remove("active");home.classList.add("active")}
function startGame(i){
 current=(i+games.length)%games.length;home.classList.remove("active");game.classList.add("active");
 gameTitle.textContent=games[current].title;setScore(0);setRound(1);bestEl.textContent=getBest();
 roundPill.style.display=games[current].type==="catch"?"none":"block";
 setup()
}
function setup(){
 resetStage();
 const t=games[current].type;
 if(t==="catch") setupCatch();
 if(t==="reveal") setupReveal();
 if(t==="files") setupFiles();
 if(t==="hunt") setupHunt();
 if(t==="build") setupBuild();
 if(t==="collect") setupCollect();
}
document.getElementById("homeBtn").onclick=showHome;
document.getElementById("restartBtn").onclick=()=>startGame(current);
document.getElementById("prevBtn").onclick=()=>startGame(current-1);
document.getElementById("nextBtn").onclick=()=>startGame(current+1);

/* GAME 1: ENDLESS CATCH — intentionally slow enough for young students */
function setupCatch(){
 directionPic("computer","DOUBLE-CLICK the moving {{WORD}}!");
 const bg=document.createElement("div");bg.className="catch-bg";stage.appendChild(bg);
 const ghost=document.createElement("div");ghost.className="catch-title";ghost.textContent="DOUBLE-CLICK!";stage.appendChild(ghost);
 const target=document.createElement("button");target.className="target";target.innerHTML='<img src="computer.png" alt="Computer">';
 target.addEventListener("click",e=>e.preventDefault());
 target.addEventListener("dblclick",e=>{
   e.preventDefault();setScore(score+1);showToast("Great double-click!");
   moveCatch(true);
 });
 stage.appendChild(target);
 function moveCatch(immediate=false){
   const pad=24,w=145,h=125;
   const maxX=Math.max(20,stage.clientWidth-w-pad*2),maxY=Math.max(20,stage.clientHeight-h-pad*2);
   const x=pad+Math.random()*maxX,y=pad+Math.random()*maxY;
   if(immediate){target.style.transitionDuration=".28s"}
   else{target.style.transitionDuration="1.45s"}
   target.style.left=x+"px";target.style.top=y+"px";
   clearTimer();
   // long pause between moves: 2.4 seconds, never becomes frantic
   timer=setTimeout(()=>{target.style.transitionDuration="1.45s";moveCatch(false)},2400);
 }
 moveCatch(true);
}

/* GAME 2: REVEAL — whole photo always visible */
const reveals=["reveal1.jpg","reveal2.jpg","reveal3.jpg","reveal4.jpg"];
function setupReveal(){
 directionText("DOUBLE-CLICK the tiles to reveal the WHOLE picture!");
 const wrap=document.createElement("div");wrap.className="reveal-wrap";
 const img=document.createElement("img");img.src=reveals[(round-1)%reveals.length];img.alt="Hidden colorful STEM picture";
 const tiles=document.createElement("div");tiles.className="reveal-tiles";let left=15;
 for(let i=0;i<15;i++){
   const b=document.createElement("button");b.className="reveal-tile";b.addEventListener("click",e=>e.preventDefault());
   b.addEventListener("dblclick",e=>{
     e.preventDefault();if(b.classList.contains("gone"))return;b.classList.add("gone");setScore(score+1);left--;
     if(left===0){
       if(round>=4){setTimeout(win,650)}
       else{setRound(round+1);setTimeout(setup,650)}
     }
   });tiles.appendChild(b)
 }
 wrap.append(img,tiles);stage.appendChild(wrap)
}

/* GAME 3: FAKE DESKTOP FILES */
const fileRounds=[
 {target:"computer",label:"CODE",fact:"Code gives a computer instructions.",folder:"folder_green.png"},
 {target:"pencil",label:"DESIGN",fact:"Engineers draw plans before they build.",folder:"folder_yellow.png"},
 {target:"clock",label:"TIME",fact:"Engineers measure time when they test.",folder:"folder_blue.png"},
 {target:"notebook",label:"DATA",fact:"Scientists record observations and data.",folder:"folder_purple.png"},
 {target:"scissors",label:"CREATE",fact:"STEM makers cut, build, test, and improve.",folder:"folder_green.png"}
];
function setupFiles(){
 const info=fileRounds[round-1];directionPic(info.target,`DOUBLE-CLICK the {{WORD}} file.`);
 const desk=document.createElement("div");desk.className="desktop";desk.innerHTML='<div class="desktop-taskbar"></div>';
 const grid=document.createElement("div");grid.className="folder-grid";
 const candidates=[
   {target:info.target,label:info.label,folder:info.folder,correct:true},
   {target:"computer",label:"TECH",folder:"folder_blue.png"},
   {target:"pencil",label:"PLAN",folder:"folder_yellow.png"},
   {target:"notebook",label:"NOTES",folder:"folder_purple.png"}
 ];
 // ensure distinct labels while keeping right folder obvious by picture badge
 candidates.forEach((c,idx)=>{
   const b=document.createElement("button");b.className="folder-btn";
   b.innerHTML=`<div style="position:relative"><img src="${c.folder}" alt="${c.label} folder"><img src="${assets[c.target].img}" alt="" style="position:absolute;width:68px;height:58px;object-fit:contain;left:50%;top:45%;transform:translate(-50%,-50%);background:white;border:3px solid #222;border-radius:10px;padding:3px"></div><div class="folder-label">${c.label}</div>`;
   b.addEventListener("click",e=>e.preventDefault());
   b.addEventListener("dblclick",e=>{
     e.preventDefault();
     if(!c.correct){showToast("Look at the picture in the direction!");return}
     openFakeWindow(info);
   });grid.appendChild(b)
 });
 desk.appendChild(grid);stage.appendChild(desk)
}
function openFakeWindow(info){
 const w=document.createElement("div");w.className="fake-window";
 w.innerHTML=`<div class="window-bar"><span>${info.label} FILE</span><button aria-label="Close">×</button></div>
 <div class="window-content"><img src="${assets[info.target].img}" alt=""><div>${info.fact}</div><p style="font-size:17px">Click the X to close this fake window.</p></div>`;
 w.querySelector("button").onclick=()=>{
   w.remove();setScore(score+1);
   if(round>=5)win();else{setRound(round+1);setTimeout(setup,250)}
 };
 stage.appendChild(w)
}

/* GAME 4: HIDDEN PICTURE HUNT — one full cartoon picture + real hotspots */
const huntRounds=[
 {scene:"hidden_room1.jpg",key:"computer"},
 {scene:"hidden_room1.jpg",key:"clock"},
 {scene:"hidden_room1.jpg",key:"bookcase"},
 {scene:"hidden_room2.jpg",key:"desk"},
 {scene:"hidden_room2.jpg",key:"chair"},
 {scene:"hidden_room2.jpg",key:"whiteboard"}
];
function setupHunt(){
 const info=huntRounds[round-1];directionPic(info.key,"Find and DOUBLE-CLICK the {{WORD}} in the picture.");
 const img=document.createElement("img");img.className="scene-img";img.src=info.scene;img.alt="Cartoon STEM classroom";
 stage.appendChild(img);
 const map=HOTSPOTS[info.scene];
 Object.entries(map).forEach(([key,r])=>{
   const b=document.createElement("button");b.className="hotspot";
   b.style.left=r[0]+"%";b.style.top=r[1]+"%";b.style.width=r[2]+"%";b.style.height=r[3]+"%";
   b.addEventListener("click",e=>e.preventDefault());
   b.addEventListener("dblclick",e=>{
     e.preventDefault();
     if(key!==info.key){b.classList.add("wrong-flash");setTimeout(()=>b.classList.remove("wrong-flash"),350);return}
     b.classList.add("correct-flash");setScore(score+1);showToast("Found it!");
     if(round>=6)setTimeout(win,550);else{setRound(round+1);setTimeout(setup,550)}
   });stage.appendChild(b)
 })
}

/* GAME 5: BUILD IT — match requested parts for three different STEM stations */
const builds=[
 {name:"CODING STATION",parts:["computer","desk","chair"]},
 {name:"DESIGN STATION",parts:["pencil","scissors","notebook"]},
 {name:"CLASSROOM LAB",parts:["clock","whiteboard","bookcase"]}
];
let buildIndex=0,partIndex=0,buildPlaced=[];
function setupBuild(){
 if(!state.initialized){
   buildIndex=0;partIndex=0;buildPlaced=[];state.initialized=true;
 }
 renderBuild();
}
function renderBuild(){
 stage.innerHTML='<div id="toast"></div>';
 const build=builds[buildIndex],target=build.parts[partIndex];
 setRound(buildIndex+1);
 directionPic(target,`${build.name}: DOUBLE-CLICK the matching {{WORD}} part.`);
 const layout=document.createElement("div");layout.className="build-layout";
 const choices=document.createElement("div");choices.className="build-choice-panel";
 const tray=document.createElement("div");tray.className="build-tray";tray.innerHTML=`<h3>${build.name}</h3>`;
 build.parts.forEach((p,i)=>{
   const slot=document.createElement("div");slot.className="build-slot"+(i<partIndex?" done":"");
   slot.innerHTML=i<partIndex?`<img src="${assets[p].img}" alt=""><b>${assets[p].word}</b>`:`<span>Part ${i+1}</span>`;
   tray.appendChild(slot)
 });
 const pool=[...new Set([target,"computer","clock","pencil","scissors","notebook","chair","bookcase","whiteboard"])]
   .sort(()=>Math.random()-.5).slice(0,6);
 if(!pool.includes(target))pool[0]=target;
 pool.forEach(key=>{
   const b=document.createElement("button");b.className="choice-btn";b.innerHTML=`<img src="${assets[key].img}" alt="${assets[key].word}">`;
   b.addEventListener("click",e=>e.preventDefault());
   b.addEventListener("dblclick",e=>{
     e.preventDefault();
     if(key!==target){showToast("That part does not match.");return}
     setScore(score+1);partIndex++;
     if(partIndex>=build.parts.length){
       buildIndex++;partIndex=0;
       if(buildIndex>=builds.length){win();return}
     }
     setTimeout(renderBuild,250)
   });choices.appendChild(b)
 });
 layout.append(choices,tray);stage.appendChild(layout)
}

/* GAME 6: COLLECT ALL MATCHES — gentle bob only */
const collectRounds=["pencil","scissors","notebook","computer"];
function setupCollect(){
 const target=collectRounds[round-1];directionPic(target,"Collect ALL the {{WORD}} pictures.");
 const board=document.createElement("div");board.className="collect-board";
 stage.appendChild(board);
 const targetCount=3;
 const items=[target,target,target,"clock","chair","marker","paperclip","glue","bookcase"];
 let remaining=targetCount;
 const spots=[[7,10],[28,12],[52,9],[75,13],[14,46],[37,48],[60,45],[80,49],[47,70]];
 items.sort(()=>Math.random()-.5).forEach((key,i)=>{
   const b=document.createElement("button");b.className="collect-item";b.style.left=spots[i][0]+"%";b.style.top=spots[i][1]+"%";b.style.animationDelay=(i*.16)+"s";
   b.innerHTML=`<img src="${assets[key].img}" alt="${assets[key].word}">`;
   b.addEventListener("click",e=>e.preventDefault());
   b.addEventListener("dblclick",e=>{
     e.preventDefault();
     if(key!==target){showToast("Only collect the matching picture.");return}
     if(b.classList.contains("gone"))return;b.classList.add("gone");remaining--;setScore(score+1);
     if(remaining===0){
       if(round>=4)setTimeout(win,550);else{setRound(round+1);setTimeout(setup,550)}
     }
   });board.appendChild(b)
 })
}
